listen: 0.0.0.0
# 冷门端口，可按需修改为其他非标准端口（避免与常见服务冲突）
port: 39689
tls:
  enabled: false
  cert: ""
  key: ""
# 客户端接入令牌，需与 agent 配置一致
agent_token: "change-me-agent-token"
admin:
  username: admin
  password: admin
# SQLite 数据库路径（相对工作目录 /app）；数据目录已挂载为持久卷
db_path: data/probe.db

# --- 以下两项均有内置默认值，一般无需修改；仅特殊部署形态下调整 ---

# 可信反代 IP/CIDR（逗号分隔）。仅当「直连来源 IP」落在此列表内才信任 X-Forwarded-For 取真实客户端。
#   · 面板经 caddy/nginx 反代时【必须】填写，否则所有请求共用反代 IP 一个登录限流桶，
#     连续 5 次失败会锁死管理员 15 分钟（self-DoS，见 v3 复审 🔴 P1）。
#   · 取值按拓扑：主机级反代（回源 127.0.0.1）→ "127.0.0.1"；docker-compose 反代
#     （caddy 与 probe 为独立容器，回源是 caddy 桥接 IP）→ docker 默认桥接段 "172.16.0.0/12"。
#   · 面板直连暴露（无反代）时留空即可：本服务会自动对私网/回环来源信任 XFF、对公网来源不信任。
#   · 留空时本服务也会自动信任来自私网/回环的 XFF（视为反代），无需手工填也能正确按真实客户端限流。
trusted_proxy: ""

# 判定离线的秒数（建议 ≥3×最大上报间隔，避免高 interval 部署抖动）。默认 15。
offline_threshold: 15
