listen: 0.0.0.0
# 冷门端口，可按需修改为其他非标准端口（避免与常见服务冲突）
port: 39689
tls:
  enabled: false
  cert: ""
  key: ""
# 客户端接入令牌，需与 agent 配置一致
agent_token: "change-me-agent-token"
admin:
  username: admin
  password: admin
# Web SSH / 批量执行 / 自动部署连接被管机器的共享密码。
#   · 留空时回退到 admin.password（明文部署可用）；
#   · 但若 admin.password 已迁移为 bcrypt 哈希，则【必须】在此显式设置明文 ssh_password，
#     否则 Web SSH / 批量 / 自动部署会把哈希当明文比对而全部失败（甚至会触发 24h 锁定，见 v5 复审 V5-1）。
#   · 此密码仅用于服务端与被管机器之间的 SSH 鉴权比对，不会被下发到目标机（规则里用的是 AES-GCM 解密后的密码）。
ssh_password: ""
# SQLite 数据库路径（相对工作目录 /app）；数据目录已挂载为持久卷
db_path: data/probe.db

# --- 以下两项均有内置默认值，一般无需修改；仅特殊部署形态下调整 ---

# 可信反代 IP/CIDR（逗号分隔）。决定本服务是否信任 X-Forwarded-For 来取真实客户端 IP 做登录限流分桶。
# 信任策略（见 v3 复审 🔴 P1 / v5 复审 🟠 V4-1 / v6 复审 🟠 V4-2）：
#   · 直连暴露（无反代）→ 留空。探针看到的源是公网客户端 IP，不信任 XFF，按源 IP 各自分桶（正确）。
#   · 经反代且探针看到的【直连来源是私网/回环】（最常见：caddy 回源 127.0.0.1、docker-compose 反代 172.x）→ 留空也行：
#     服务会自动对私网/回环来源信任 XFF（公网攻击者无法伪造私网/回环，BCP38 入口过滤丢弃），按真实客户端分桶（正确，无 self-DoS）。
#   · 仅当反代/CDN 呈现【公网 IP】给探针时（如 Cloudflare 边缘节点）→【必须】在此填入这些公网 IP/CIDR，
#     否则探针看到公网源、不信任 XFF、所有请求共用反代 IP 一个桶 → 5 次失败锁死管理员 15 分钟（self-DoS）。
#   · 取值示例：docker-compose 反代桥接段 "172.16.0.0/12"；Cloudflare 等公网边缘段见官方文档。
#   · 若显式填了 trusted_proxy 但填错（私网/回环来源没在列表内），服务仍会按私网/回环自动信任 XFF（不会 self-DoS），
#     只是放弃了「只信任列表内反代」的收紧效果——核对取值即可。
trusted_proxy: ""

# 判定离线的秒数（建议 ≥3×最大上报间隔，避免高 interval 部署抖动）。默认 15。
offline_threshold: 15
